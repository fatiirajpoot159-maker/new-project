<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{box-sizing:border-box;font-family:Arial;}
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#667eea,#764ba2);
}

.card{
  width:340px;
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  animation:fade .6s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(-20px);}
  to{opacity:1; transform:translateY(0);}
}

h2{text-align:center;margin-bottom:15px;}

input{
  width:100%;
  padding:11px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
  transition:.3s;
}

input:focus{
  border-color:#667eea;
  box-shadow:0 0 6px rgba(102,126,234,.4);
  outline:none;
}

button{
  width:100%;
  padding:11px;
  background:#667eea;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
  transition:.3s;
}

button:hover{background:#5a67d8; transform:translateY(-2px);}

.error{color:red;font-size:13px;}
.success{
  color:green;
  text-align:center;
  font-size:14px;
  margin-top:10px;
}

.link{text-align:center;margin-top:10px;}
</style>
</head>

<body>

<div class="card">
<h2>Login</h2>

<form onsubmit="return loginCheck()">
<input type="text" id="user" placeholder="Username">
<div id="userErr" class="error"></div>

<input type="password" id="pass" placeholder="Password">
<div id="passErr" class="error"></div>

<button>Login</button>
</form>

<div id="msg" class="success"></div>

<div class="link">
<a href="signup.html">Create account</a>
</div>
</div>

<script>
function loginCheck(){
  let u=document.getElementById("user").value;
  let p=document.getElementById("pass").value;
  let ok=true;

  document.getElementById("userErr").innerText="";
  document.getElementById("passErr").innerText="";
  document.getElementById("msg").innerText="";

  if(u===""){
    document.getElementById("userErr").innerText="Username required";
    ok=false;
  }

  if(p.length<6){
    document.getElementById("passErr").innerText="Password must be 6+ characters";
    ok=false;
  }

  if(ok){
    document.getElementById("msg").innerText="✔ You have logged in successfully";
  }
  return false;
}
</script>

</body>
</html>
